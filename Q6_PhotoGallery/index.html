<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Yashna’s Photo Gallery</h1>
    <p>Captured moments & beautiful memories 📸</p>
  </header>

  <section class="gallery">
    <div class="photo">
      <img src="images/pic1.jpg" alt="Beach Sunset">
      <div class="caption">Golden Beach Sunset</div>
    </div>
    <div class="photo">
      <img src="images/pic2.png" alt="Mountain View">
      <div class="caption">Peaceful Mountains</div>
    </div>
    <div class="photo">
      <img src="images/pic3.jpg" alt="Forest Path">
      <div class="caption">Forest Walk</div>
    </div>
    <div class="photo">
      <img src="images/pic4.jpg" alt="City Lights">
      <div class="caption">City Lights at Night</div>
    </div>
    <div class="photo">
      <img src="images/pic5.jpg" alt="Waterfall">
      <div class="caption">Hidden Waterfall</div>
    </div>
    <div class="photo">
      <img src="images/pic6.jpg" alt="Desert Dunes">
      <div class="caption">Desert Dunes</div>
    </div>
  </section>

  <footer>
    <p>© 2025 Yashna Yogi | All Rights Reserved</p>
  </footer>
</body>
</html>
