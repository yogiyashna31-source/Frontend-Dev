<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page Greeting</title>
    <link rel="stylesheet" href="style.css">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1 id="greeting">Welcome!</h1>
    </header>

    <main>
        <section id="welcome-section">
            <p id="welcome-message">We are glad to see you here!</p>
            <button id="change-greeting">Change Greeting</button>
            <button id="toggle-message">Toggle Welcome Message</button>
        </section>

        <section id="extras">
            <p>Enjoy exploring our website!</p>
            <p>Have a wonderful day!</p>
            <p>Remember to check new updates!</p>
            <p>Don't forget to subscribe!</p>
            <p>Follow us on social media!</p>
        </section>
    </main>
</body>
</html>
