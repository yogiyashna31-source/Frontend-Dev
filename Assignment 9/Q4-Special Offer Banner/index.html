<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offer Banner</title>
    <link rel="stylesheet" href="style.css">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Special Offers</h1>
    </header>

    <main>
        <section id="banner-controls">
            <button id="hide-banner">Hide</button>
            <button id="show-banner">Show</button>
            <button id="slide-up">Slide Up</button>
            <button id="slide-down">Slide Down</button>
            <button id="fade-toggle">Fade In/Out</button>
        </section>

        <section id="banners">
            <div class="banner" style="background-color: #ffcccc;">50% Off on Shoes!</div>
            <div class="banner" style="background-color: #ccffcc;">Buy 1 Get 1 Free!</div>
            <div class="banner" style="background-color: #ccccff;">Free Shipping Today!</div>
            <div class="banner" style="background-color: #fff0b3;">20% Off Electronics!</div>
            <div class="banner" style="background-color: #ffccff;">Flash Sale Ends Soon!</div>
        </section>
    </main>
</body>
</html>
