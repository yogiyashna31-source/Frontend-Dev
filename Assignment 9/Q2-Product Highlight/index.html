<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Highlight</title>
    <link rel="stylesheet" href="style.css">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Our Products</h1>
    </header>

    <main>
        <section id="products">
            <!-- Product 1 -->
            <div class="product" data-stock="available" data-discount="10%">
                <h3>Product 1</h3>
                <p class="details">High-quality material.</p>
                <span class="favorite">♡</span>
            </div>

            <!-- Product 2 -->
            <div class="product" data-stock="out" data-discount="20%">
                <h3>Product 2</h3>
                <p class="details">Limited edition item.</p>
                <span class="favorite">♡</span>
            </div>

            <!-- Product 3 -->
            <div class="product" data-stock="available">
                <h3>Product 3</h3>
                <p class="details">Best seller product.</p>
                <span class="favorite">♡</span>
            </div>

            <!-- Product 4 -->
            <div class="product" data-stock="available" data-discount="15%">
                <h3>Product 4</h3>
                <p class="details">Eco-friendly choice.</p>
                <span class="favorite">♡</span>
            </div>

            <!-- Product 5 -->
            <div class="product" data-stock="available">
                <h3>Product 5</h3>
                <p class="details">Top-rated by customers.</p>
                <span class="favorite">♡</span>
            </div>
        </section>
    </main>
</body>
</html>
