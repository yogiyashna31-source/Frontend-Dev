<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-inner">
        <div class="card-front">
          <img src="kdrama.webp" alt="K-drama Poster">
          <div class="title-overlay">
            <h2>K-Drama Magic</h2>
          </div>
        </div>
        <div class="card-back">
          <p>
            Dive into emotional storytelling, stunning visuals, and heartwarming moments.  
            Experience the magic of K-Dramas that captivate hearts worldwide.
          </p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
