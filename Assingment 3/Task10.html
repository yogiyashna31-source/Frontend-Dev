<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection Page</title>
</head>
<body>

    <h1>Travel Selection</h1>

    <form>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="france" selected>France</option>
            <option value="japan">Japan</option>
            <option value="bali">Indonesia</option>
        </select><br><br>

        <label for="state">State/Province:</label>
        <select id="state" name="state">
            <option value="ile-de-france" selected>Île-de-France</option>
            <option value="kyoto">Kyoto</option>
            <option value="bali-province">Bali Province</option>
        </select><br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option value="paris" selected>Paris</option>
            <option value="kyoto-city">Kyoto</option>
            <option value="denpasar">Denpasar</option>
        </select><br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option value="eiffel" selected>Eiffel Tower</option>
            <option value="kinkakuji">Kinkaku-ji</option>
            <option value="tanah-lot">Tanah Lot Temple</option>
        </select>
    </form>

    <p>You have chosen: Country - France, State - Île-de-France, City - Paris, Place - Eiffel Tower.</p>

</body>
</html>
